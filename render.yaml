# =============================================================================
# MAANMITRA — Render.com Blueprint
# Full-stack: FastAPI backend (web service) + React/Vite frontend (static site)
# Database: Render-managed PostgreSQL (virginia region)
# WebSockets: Supported via uvicorn[standard] + FastAPI WebSocket
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. BACKEND — FastAPI + Uvicorn (Web Service)
  #    WebSocket-capable, PostgreSQL-connected, file uploads supported
  # ---------------------------------------------------------------------------
  - type: web
    name: maanmitra-backend
    runtime: python
    region: virginia          # Same region as the DB for lowest latency
    plan: starter             # Use starter (not free) for persistent disk + no sleep
    rootDir: backend

    buildCommand: pip install --no-cache-dir -r requirements.txt

    # Uvicorn with websocket=websockets for full WS support (standard extra)
    startCommand: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 2
      --ws websockets
      --log-level info

    healthCheckPath: /api/v1/health

    # Persistent disk for user-uploaded profile photos
    disk:
      name: maanmitra-uploads
      mountPath: /app/uploads
      sizeGB: 1

    envVars:
      # ---- Python runtime ----
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ---- Database (Existing Render PostgreSQL) ----
      - key: DATABASE_URL
        value: "postgresql://maanmitra_user:rciSwj9rBMHMePEeaGjHEJBuc8U8g7Gd@dpg-dbmh9vt9el5s73dpu9o0-a.virginia-postgres.render.com/maanmitra"

      # ---- Auth ----
      - key: JWT_SECRET
        generateValue: true          # Render generates a secure 32-char random value
      - key: ACCESS_TOKEN_MINUTES
        value: "720"                 # 12-hour JWT tokens

      # ---- CORS (comma-separated list of frontend origins) ----
      - key: CORS_ORIGINS
        value: "https://maanmitra.onrender.com,https://www.maanmitra.com"

      # ---- File uploads ----
      - key: UPLOAD_DIR
        value: "/app/uploads"

      # ---- Razorpay (set your live keys in Render dashboard) ----
      - key: RAZORPAY_KEY_ID
        sync: false                  # Set manually in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false                  # Set manually in Render dashboard

  # ---------------------------------------------------------------------------
  # 2. FRONTEND — React + Vite (Static Site)
  #    SPA with client-side routing rewrite (served via Render Global CDN)
  # ---------------------------------------------------------------------------
  - type: web
    name: maanmitra-frontend
    runtime: static

    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    # SPA routing — all paths serve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Security headers for production
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=*, microphone=*, display-capture=*"
      # Aggressive cache for hashed static assets
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # No-cache for index.html
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

    envVars:
      # Backend API URL — injected at build time by Vite
      - key: VITE_API_URL
        value: "https://maanmitra-backend.onrender.com/api/v1"

      # WebSocket URL (wss:// for production TLS)
      - key: VITE_WS_URL
        value: "wss://maanmitra-backend.onrender.com/api/v1"

      # Razorpay publishable key (safe to expose in frontend)
      - key: VITE_RAZORPAY_KEY_ID
        sync: false                  # Set manually in Render dashboard
