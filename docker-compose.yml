services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: living_relationships
      POSTGRES_USER: living
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-living_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U living -d living_relationships"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://living:${POSTGRES_PASSWORD:-living_dev_password}@db:5432/living_relationships
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-deployment-with-a-long-random-value}
      ACCESS_TOKEN_MINUTES: 720
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      UPLOAD_DIR: /app/uploads
    volumes:
      - private_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - api
    ports:
      - "5173:5173"
volumes:
  postgres_data:
  private_uploads:
